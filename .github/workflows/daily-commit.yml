name: daily-commit

on:
  schedule:
    - cron: "0 1 * * *" # 北京时间每天 09:00 (UTC 01:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算今天日期
        id: date
        run: echo "date=$(TZ=Asia/Shanghai date +'%-m.%-d-%Y')" >> "$GITHUB_OUTPUT"

      - name: 发布当天文件夹并推送到 GitHub
        run: |
          DATE="${{ steps.date.outputs.date }}"
          if [ ! -d "pending/$DATE" ]; then
            echo "今日($DATE)无待发布内容，跳过"
            exit 0
          fi
          git config user.name "SHIZHU222"
          git config user.email "wxwkjal@outlook.com"
          mv "pending/$DATE" "$DATE"
          git add -A
          git commit -m "今日训练 $DATE"
          git push origin master

      - name: 配置 Gitee SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host gitee.com\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config

      - name: 镜像并推送到 Gitee
        run: |
          DATE="${{ steps.date.outputs.date }}"
          if [ ! -d "pending/$DATE" ] && [ ! -d "$DATE" ]; then
            echo "今日($DATE)无内容，跳过 Gitee"
            exit 0
          fi
          GITEE_DIR="$RUNNER_TEMP/gitee-clone"
          rm -rf "$GITEE_DIR"
          git clone git@gitee.com:CCCSHIZHU/journey-of-learning-c.git "$GITEE_DIR"
          cd "$GITEE_DIR"
          git config user.name "CCCSHIZHU"
          git config user.email "ybfffw@163.com"
          rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/" ./
          git add -A
          if git diff --cached --quiet; then
            echo "Gitee 无变化"
          else
            git commit -m "今日训练 $DATE"
            git push origin master
          fi

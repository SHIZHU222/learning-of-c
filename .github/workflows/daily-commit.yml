name: daily-commit

on:
  schedule:
    - cron: "0 1 * * *" # 北京时间每天 09:00 (UTC 01:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 查找下一个待发布文件夹
        id: next
        run: echo "name=$(find pending -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort | head -1)" >> "$GITHUB_OUTPUT"

      - name: 发布当天文件夹并推送到 GitHub
        run: |
          NEXT="${{ steps.next.outputs.name }}"
          if [ -z "$NEXT" ]; then
            echo "没有待发布内容，跳过"
            exit 0
          fi
          git config user.name "<你的GitHub用户名>"
          git config user.email "<你的GitHub邮箱>"
          mv "pending/$NEXT" "$NEXT"
          git add -A
          git commit -m "今日训练 $NEXT"
          git push origin master

      - name: 配置 Gitee SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host gitee.com\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config

      - name: 镜像并推送到 Gitee
        run: |
          NEXT="${{ steps.next.outputs.name }}"
          if [ -z "$NEXT" ]; then
            echo "没有待发布内容，跳过 Gitee"
            exit 0
          fi
          GITEE_DIR="$RUNNER_TEMP/gitee-clone"
          rm -rf "$GITEE_DIR"
          git clone git@gitee.com:<你的Gitee用户名>/<你的Gitee仓库名>.git "$GITEE_DIR"
          cd "$GITEE_DIR"
          git config user.name "<你的Gitee用户名>"
          git config user.email "<你的Gitee邮箱>"
          rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/" ./
          git add -A
          if git diff --cached --quiet; then
            echo "Gitee 无变化"
          else
            git commit -m "今日训练 $NEXT"
            git push origin master
          fi
